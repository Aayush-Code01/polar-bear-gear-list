    <script>
        const SHEET_ID = '1_AvwvVEFlmxadelY73dG6u1QP1LCKLzEnz3EzWcvlMQ';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=Live`;

        let inventoryData = [];
        let selectedItems = new Set();
        let activeCategory = 'all';

        // Dark Mode Logic
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cur = '';
            let inQuote = false;
            
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let next = text[i + 1];
                
                if (char === '"' && inQuote && next === '"') {
                    cur += '"';
                    i++;
                } else if (char === '"') {
                    inQuote = !inQuote;
                } else if (char === ',' && !inQuote) {
                    row.push(cur.trim());
                    cur = '';
                } else if ((char === '\r' || char === '\n') && !inQuote) {
                    row.push(cur.trim());
                    if (row.length > 0) rows.push(row);
                    row = [];
                    cur = '';
                    if (char === '\r' && next === '\n') i++;
                } else {
                    cur += char;
                }
            }
            if (cur !== '' || row.length > 0) {
                row.push(cur.trim());
                rows.push(row);
            }
            return rows;
        }

        async function fetchInventory() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                if (rows.length < 1) throw new Error('Empty spreadsheet');

                const headers = rows[0].map(h => h.toLowerCase().trim());
                const catIdx = headers.indexOf('category');
                const descIdx = headers.indexOf('description');
                const qtyIdx = headers.indexOf('qty');

                if (catIdx === -1 || descIdx === -1) {
                    throw new Error('Required headers "Category" and "Description" not found.');
                }

                const rawItems = [];
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length <= Math.max(catIdx, descIdx)) continue;
                    
                    const category = row[catIdx];
                    const description = row[descIdx];
                    const qty = (qtyIdx !== -1 && row[qtyIdx]) ? row[qtyIdx] : '1';
                    
                    if (category && description && isNaN(category)) {
                        rawItems.push({ category, name: description, qty });
                    }
                }

                const groups = {};
                rawItems.forEach(item => {
                    if (!groups[item.category]) {
                        groups[item.category] = {
                            id: item.category.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                            category: item.category,
                            items: []
                        };
                    }
                    groups[item.category].items.push({ name: item.name, qty: item.qty });
                });

                inventoryData = Object.values(groups);
                populateDropdown();
                renderInventory();
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('inventory-container').innerHTML = `<p class="text-center text-red-500 py-10">${error.message}</p>`;
            }
        }

        function populateDropdown() {
            const select = document.getElementById('category-select');
            const currentOptions = '<option value="all">All Inventory</option>';
            const categoryOptions = inventoryData.map(cat => `
                <option value="${cat.id}">${cat.category}</option>
            `).join('');
            select.innerHTML = currentOptions + categoryOptions;
        }

        function setActiveCategory(id) {
            activeCategory = id;
            renderInventory();
            if (id !== 'all') {
                const target = document.getElementById(`section-${id}`);
                if (target) {
                    const headerOffset = 180;
                    const elementPosition = target.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                    window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                }
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function toggleCategory(catId) {
            const category = inventoryData.find(c => c.id === catId);
            if (!category) return;

            const allNames = category.items.map(i => i.name);
            const allSelected = allNames.every(name => selectedItems.has(name));

            if (allSelected) {
                allNames.forEach(name => selectedItems.delete(name));
            } else {
                allNames.forEach(name => selectedItems.add(name));
            }

            renderInventory();
            updateInquiryBar();
        }

        function renderInventory() {
            const container = document.getElementById('inventory-container');
            const filteredData = activeCategory === 'all' 
                ? inventoryData 
                : inventoryData.filter(cat => cat.id === activeCategory);

            if (filteredData.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 dark:text-slate-500 py-10">No items found.</p>';
                return;
            }

            container.innerHTML = filteredData.map((cat) => {
                const allSelected = cat.items.every(i => selectedItems.has(i.name));
                return `
                <section id="section-${cat.id}" class="px-1">
                    <div class="flex items-center justify-between mb-4 sm:mb-8 border-b-2 border-slate-50 dark:border-slate-800 pb-3 sm:pb-4 transition-colors">
                        <div class="flex-1">
                            <h3 class="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight leading-tight transition-colors">
                                ${cat.category}
                            </h3>
                            <div class="flex items-center space-x-3 mt-1">
                                <span class="text-[9px] sm:text-[10px] font-black text-brand dark:text-blue-400 tracking-[0.1em] uppercase bg-brand/5 dark:bg-brand/20 px-2 py-1 rounded-md whitespace-nowrap">${cat.items.length} Units</span>
                            </div>
                        </div>
                        <button onclick="toggleCategory('${cat.id}')" 
                                class="flex items-center space-x-2 px-3 py-2 rounded-xl border-2 transition-all active:scale-95
                                ${allSelected ? 'bg-brand border-brand text-white dark:bg-blue-600 dark:border-blue-600' : 'bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:border-brand/40 dark:hover:border-blue-500/40'}">
                            <span class="text-[10px] font-black uppercase tracking-wider">${allSelected ? 'Clear Kit' : 'Select Kit'}</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        </button>
                    </div>
                    <!-- Updated Grid for 2 columns on mobile -->
                    <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 sm:gap-4">
                        ${cat.items.map((item, itemIdx) => {
                            const uniqueId = `item-${cat.id}-${itemIdx}`;
                            const isChecked = selectedItems.has(item.name);
                            return `
                                <div class="relative group">
                                    <input type="checkbox" id="${uniqueId}" class="hidden" 
                                           ${isChecked ? 'checked' : ''}
                                           onchange="toggleItem('${uniqueId}', '${item.name.replace(/'/g, "\\'")}')">
                                    <!-- Reduced padding on mobile to accommodate 2 columns -->
                                    <label for="${uniqueId}" class="item-card flex items-center justify-between p-2.5 sm:p-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl sm:rounded-2xl cursor-pointer hover:border-brand/30 dark:hover:border-blue-500/30 transition-all select-none transition-colors">
                                        <div class="flex items-center space-x-2 sm:space-x-4 pr-1 min-w-0">
                                            <div class="check-icon ${isChecked ? 'opacity-100 scale-100' : 'opacity-0 scale-50'} transition-all text-brand dark:text-blue-400 shrink-0">
                                                <svg class="w-4 h-4 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                                            </div>
                                            <!-- Smaller font size on mobile to prevent overflow in 2-column layout -->
                                            <span class="text-[11px] sm:text-[15px] font-bold text-slate-800 dark:text-slate-200 leading-tight truncate sm:whitespace-normal">${item.name}</span>
                                        </div>
                                        <div class="text-[8px] sm:text-[10px] font-black bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-1.5 py-0.5 sm:px-2 sm:py-1 rounded uppercase tracking-tighter shrink-0 transition-colors">
                                            x${item.qty}
                                        </div>
                                    </label>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </section>
                `;
            }).join('');
        }

        function toggleItem(id, name) {
            if (selectedItems.has(name)) {
                selectedItems.delete(name);
            } else {
                selectedItems.add(name);
            }
            updateInquiryBar();
            renderInventory(); 
        }

        function updateInquiryBar() {
            const bar = document.getElementById('inquiry-bar');
            const countEl = document.getElementById('selected-count');
            countEl.textContent = selectedItems.size;
            if (selectedItems.size > 0) {
                bar.classList.add('visible');
            } else {
                bar.classList.remove('visible');
            }
        }

        function clearSelection() {
            selectedItems.clear();
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateInquiryBar();
            renderInventory(); 
        }

        function generateListString() {
            return Array.from(selectedItems).join('%0A• ');
        }

        function sendWhatsApp() {
            const list = generateListString();
            const message = `*Polar Bear Films - Gear Inquiry*%0A%0AHello Himanshu, I'm interested in renting the following items:%0A%0A• ${list}%0A%0APlease share availability and a quote for these.`;
            window.open(`https://wa.me/919650563719?text=${message}`, '_blank');
        }

        function sendEmail() {
            const list = Array.from(selectedItems).join('%0D%0A• ');
            const subject = "Rental Inquiry: Polar Bear Films Inventory";
            const body = `Dear Polar Bear Films Team,%0D%0A%0D%0AI am reaching out to inquire about the following equipment availability:%0D%0A%0D%0A• ${list}%0D%0A%0D%0APlease let me know the rental rates for these items for my upcoming project.%0D%0A%0D%0ABest regards.`;
            window.location.href = `mailto:himanshusharma280@gmail.com?subject=${subject}&body=${body}`;
        }

        window.onload = () => {
            initTheme();
            fetchInventory();
        };
    </script>
</body>
</html>
