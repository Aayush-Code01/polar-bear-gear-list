    <script>
        // Constants
        const SHEET_ID = '1_AvwvVEFlmxadelY73dG6u1QP1LCKLzEnz3EzWcvlMQ';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=Live`;

        // App State
        const state = {
            data: [], // Array of category objects
            selected: new Map(), // name => { qty, category }
            expanded: new Set(), // category IDs that are currently expanded (starts empty!)
            searchQuery: '',
            activeCategory: 'all',
            isDark: false
        };

        // DOM Elements
        const DOM = {
            inventoryContainer: document.getElementById('inventory-container'),
            categorySelect: document.getElementById('category-select'),
            searchInput: document.getElementById('search-input'),
            searchDropdown: document.getElementById('search-dropdown'),
            checkoutBar: document.getElementById('checkout-bar'),
            selectedCount: document.getElementById('selected-count'),
            previewModal: document.getElementById('preview-modal'),
            modalList: document.getElementById('modal-list'),
            modalSubtitle: document.getElementById('modal-subtitle'),
            modalFooter: document.getElementById('modal-footer'),
            currentYear: document.getElementById('current-year')
        };

        DOM.currentYear.textContent = new Date().getFullYear();

        // Theme Initialization
        function initTheme() {
            const isDarkStored = localStorage.getItem('theme') === 'dark';
            const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDarkStored || (!localStorage.getItem('theme') && isSystemDark)) {
                state.isDark = true;
                document.documentElement.classList.add('dark');
            }
        }
        initTheme();

        // CSV Parser
        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cur = '';
            let inQuote = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let next = text[i + 1];
                if (char === '"' && inQuote && next === '"') { cur += '"'; i++; }
                else if (char === '"') { inQuote = !inQuote; }
                else if (char === ',' && !inQuote) { row.push(cur.trim()); cur = ''; }
                else if ((char === '\r' || char === '\n') && !inQuote) {
                    row.push(cur.trim());
                    if (row.length > 0) rows.push(row);
                    row = []; cur = '';
                    if (char === '\r' && next === '\n') i++;
                } else { cur += char; }
            }
            if (cur !== '' || row.length > 0) { row.push(cur.trim()); rows.push(row); }
            return rows;
        }

        // Fetch Data
        async function fetchInventory() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const text = await response.text();
                const rows = parseCSV(text);
                
                if (rows.length < 2) throw new Error('No data found');

                const headers = rows[0].map(h => h.toLowerCase().trim());
                const catIdx = headers.indexOf('category');
                const descIdx = headers.indexOf('description');
                const qtyIdx = headers.indexOf('qty');

                const groups = {};
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length <= Math.max(catIdx, descIdx)) continue;
                    
                    const category = row[catIdx];
                    const name = row[descIdx];
                    const qty = (qtyIdx !== -1 && row[qtyIdx]) ? row[qtyIdx] : '1';

                    if (category && name && isNaN(category)) {
                        const catId = category.toLowerCase().replace(/[^a-z0-9]/g, '-');
                        if (!groups[catId]) {
                            groups[catId] = { id: catId, title: category, items: [] };
                        }
                        groups[catId].items.push({ name, qty, id: name.replace(/[^a-zA-Z0-9]/g, '') + i });
                    }
                }
                
                state.data = Object.values(groups);
                populateCategoryDropdown();
                renderInventory();
            } catch (error) {
                console.error("Error loading data:", error);
                DOM.inventoryContainer.innerHTML = `
                    <div class="p-8 text-center bg-red-50 dark:bg-red-900/10 text-red-600 dark:text-red-400 rounded-3xl font-bold border border-red-100 dark:border-red-900/30">
                        Could not load inventory. Please try again later.
                    </div>
                `;
            }
        }

        // Populate Dropdown
        function populateCategoryDropdown() {
            let options = '<option value="all">All Categories</option>';
            state.data.forEach(cat => {
                options += `<option value="${cat.id}">${cat.title}</option>`;
            });
            DOM.categorySelect.innerHTML = options;
        }

        // Main Render Function
        function renderInventory() {
            const q = state.searchQuery.toLowerCase().replace(/\s+/g, '');
            let html = '';

            const filteredData = state.data
                .filter(cat => state.activeCategory === 'all' || cat.id === state.activeCategory)
                .map(cat => {
                    const items = cat.items.filter(item => 
                        !q || item.name.toLowerCase().replace(/\s+/g, '').includes(q)
                    );
                    return { ...cat, items };
                })
                .filter(cat => cat.items.length > 0);

            if (filteredData.length === 0) {
                DOM.inventoryContainer.innerHTML = `<div class="py-20 text-center text-slate-400 font-medium">No gear found matching your criteria.</div>`;
                return;
            }

            filteredData.forEach(cat => {
                const isExpanded = state.expanded.has(cat.id);
                // Check if ALL filtered items in this category are selected
                const allSelected = cat.items.length > 0 && cat.items.every(item => state.selected.has(item.name));
                
                html += `
                    <section id="cat-${cat.id}" class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800/60 overflow-hidden mb-6 transition-all duration-300 hover:shadow-md">
                        <!-- Header -->
                        <div data-action="toggle-category-expand" data-id="${cat.id}" class="flex items-center justify-between p-4 sm:p-5 cursor-pointer select-none group bg-slate-50/50 dark:bg-slate-800/20 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                            <div class="flex items-center space-x-3 sm:space-x-4 flex-1 min-w-0 pr-4 pointer-events-none">
                                <div class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 group-hover:bg-brand/10 dark:group-hover:bg-blue-500/20 group-hover:text-brand dark:group-hover:text-blue-400 transition-all duration-300 ${isExpanded ? 'rotate-180 bg-brand/10 text-brand dark:bg-blue-500/20 dark:text-blue-400' : ''}">
                                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <h3 class="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-white truncate tracking-tight">${cat.title}</h3>
                                    <div class="flex items-center space-x-2 mt-0.5">
                                        <span class="text-[10px] sm:text-xs font-black text-slate-400 uppercase tracking-wider">${cat.items.length} Items</span>
                                        ${q ? `<span class="text-[10px] bg-brand/10 text-brand px-1.5 rounded">Filtered</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            <button data-action="toggle-all-category" data-id="${cat.id}" data-selected="${allSelected}" class="relative z-10 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-wider transition-all duration-200 active:scale-95 whitespace-nowrap overflow-hidden ${allSelected ? 'bg-brand text-white border-transparent shadow-md shadow-brand/20' : 'bg-white dark:bg-slate-950 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:border-brand/50 dark:hover:border-blue-500/50'}">
                                ${allSelected ? 'Clear All' : 'Select All'}
                            </button>
                        </div>

                        <!-- Grid -->
                        <div class="category-content ${isExpanded ? 'expanded' : ''}">
                            <div class="p-4 sm:p-5 pt-0 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 bg-slate-50/20 dark:bg-transparent">
                                ${cat.items.map(item => {
                                    const isSelected = state.selected.has(item.name);
                                    // Use data attributes heavily to avoid quote escaping issues
                                    return `
                                        <div data-action="toggle-item" data-name="${encodeURIComponent(item.name)}" data-qty="${item.qty}" data-cattitle="${encodeURIComponent(cat.title)}" class="relative group flex items-center justify-between p-3 sm:p-4 h-full rounded-2xl border-2 transition-all duration-200 cursor-pointer select-none ${isSelected ? 'bg-blue-50/50 dark:bg-blue-900/20 border-brand dark:border-blue-500 shadow-sm' : 'bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 hover:border-brand/30 dark:hover:border-blue-500/40 hover:shadow-md'}">
                                            <div class="flex items-center space-x-3 flex-1 min-w-0 pointer-events-none">
                                                <div class="flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 flex items-center justify-center transition-all duration-300 ${isSelected ? 'border-brand dark:border-blue-500 bg-brand dark:bg-blue-500 text-white' : 'border-slate-300 dark:border-slate-600 group-hover:border-brand/50 dark:group-hover:border-blue-500/50'}">
                                                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 transition-transform duration-300 ${isSelected ? 'scale-100' : 'scale-0'}" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                                                </div>
                                                <span class="text-[13px] sm:text-[15px] font-bold leading-tight truncate transition-colors ${isSelected ? 'text-brand dark:text-blue-100' : 'text-slate-700 dark:text-slate-200'}">${item.name}</span>
                                            </div>
                                            ${item.qty && item.qty !== '1' ? `<div class="ml-2 flex-shrink-0 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-md text-[10px] sm:text-xs font-black text-slate-500 dark:text-slate-400 pointer-events-none">x${item.qty}</div>` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </section>
                `;
            });
            
            DOM.inventoryContainer.innerHTML = html;
        }

        function updateCheckoutState() {
            const count = state.selected.size;
            DOM.selectedCount.textContent = count;
            
            if (count > 0) {
                DOM.checkoutBar.classList.remove('translate-y-full');
            } else {
                DOM.checkoutBar.classList.add('translate-y-full');
                // Auto close modal if open
                if (!DOM.previewModal.classList.contains('hidden')) {
                    DOM.previewModal.classList.add('hidden');
                    DOM.previewModal.classList.remove('flex');
                }
            }
        }

        // Event Delegation for all interactive elements
        document.body.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            
            const action = target.dataset.action;
            
            if (action === 'toggle-theme') {
                state.isDark = !state.isDark;
                if (state.isDark) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }
            else if (action === 'toggle-category-expand') {
                const id = target.dataset.id;
                if (state.expanded.has(id)) state.expanded.delete(id);
                else state.expanded.add(id);
                renderInventory();
            }
            else if (action === 'toggle-all-category') {
                e.stopPropagation(); // prevent row click
                const id = target.dataset.id;
                const isAllCurrentlySelected = target.dataset.selected === 'true';
                
                const cat = state.data.find(c => c.id === id);
                if (!cat) return;
                
                // respect search filter
                const q = state.searchQuery.toLowerCase().replace(/\s+/g, '');
                const itemsToProcess = cat.items.filter(item => !q || item.name.toLowerCase().replace(/\s+/g, '').includes(q));

                itemsToProcess.forEach(item => {
                    if (isAllCurrentlySelected) {
                        state.selected.delete(item.name);
                    } else {
                        state.selected.set(item.name, { qty: item.qty, category: cat.title });
                    }
                });
                
                renderInventory();
                updateCheckoutState();
            }
            else if (action === 'toggle-item') {
                const name = decodeURIComponent(target.dataset.name);
                const qty = target.dataset.qty;
                const catTitle = decodeURIComponent(target.dataset.cattitle);
                
                if (state.selected.has(name)) {
                    state.selected.delete(name);
                } else {
                    state.selected.set(name, { qty, category: catTitle });
                }
                renderInventory();
                updateCheckoutState();
            }
            else if (action === 'clear-selection') {
                state.selected.clear();
                renderInventory();
                updateCheckoutState();
            }
            else if (action === 'open-preview') {
                renderModal();
                DOM.previewModal.classList.remove('hidden');
                DOM.previewModal.classList.add('flex');
            }
            else if (action === 'close-preview') {
                DOM.previewModal.classList.add('hidden');
                DOM.previewModal.classList.remove('flex');
            }
            else if (action === 'remove-modal-item') {
                const name = decodeURIComponent(target.dataset.name);
                state.selected.delete(name);
                renderModal();
                renderInventory();
                updateCheckoutState();
            }
            else if (action === 'select-search-item') {
                const name = decodeURIComponent(target.dataset.name);
                const qty = target.dataset.qty;
                const catTitle = decodeURIComponent(target.dataset.cattitle);
                const catId = target.dataset.catid;

                // Select item
                state.selected.set(name, { qty, category: catTitle });
                
                // Expand the category it belongs to so it's visible
                state.expanded.add(catId);
                
                // Reset search
                state.searchQuery = '';
                DOM.searchInput.value = '';
                DOM.searchDropdown.classList.add('hidden');
                
                renderInventory();
                updateCheckoutState();
                
                // Scroll to it
                setTimeout(() => {
                    const el = document.getElementById(`cat-${catId}`);
                    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 150, behavior: 'smooth' });
                }, 100);
            }
            else if (action === 'send-whatsapp') {
                sendWhatsApp();
            }
            else if (action === 'send-email') {
                sendEmail();
            }
        });

        // Search Input Handling
        DOM.searchInput.addEventListener('input', (e) => {
            state.searchQuery = e.target.value;
            const q = state.searchQuery.toLowerCase().replace(/\s+/g, '');
            
            if (!q) {
                DOM.searchDropdown.classList.add('hidden');
                return;
            }

            let results = [];
            state.data.forEach(cat => {
                cat.items.forEach(item => {
                    if (item.name.toLowerCase().replace(/\s+/g, '').includes(q)) {
                        results.push({ ...item, categoryTitle: cat.title, categoryId: cat.id });
                    }
                });
            });

            if (results.length > 0) {
                let html = `
                    <div class="px-4 py-2 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center sticky top-0 z-10 backdrop-blur-md">
                        <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Results</span>
                        <span class="text-[10px] font-black bg-brand/10 dark:bg-blue-500/20 text-brand dark:text-blue-400 px-2 py-0.5 rounded-full">${results.length}</span>
                    </div>
                    <div class="py-2">
                `;
                
                results.slice(0, 15).forEach(match => {
                    html += `
                        <button data-action="select-search-item" data-name="${encodeURIComponent(match.name)}" data-qty="${match.qty}" data-cattitle="${encodeURIComponent(match.categoryTitle)}" data-catid="${match.categoryId}" class="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between transition-colors border-b border-slate-50 dark:border-slate-800/30 last:border-0">
                            <div class="min-w-0 pr-3">
                                <p class="text-sm font-bold text-slate-800 dark:text-slate-200 truncate">${match.name}</p>
                                <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5 tracking-wide">${match.categoryTitle}</p>
                            </div>
                            <div class="shrink-0 text-[10px] font-black text-brand dark:text-blue-400 bg-brand/5 dark:bg-blue-500/10 px-2 py-1 rounded">SELECT</div>
                        </button>
                    `;
                });
                
                if (results.length > 15) {
                    html += `<div class="px-4 py-3 text-center text-xs font-bold text-slate-400">+ ${results.length - 15} more. Keep typing.</div>`;
                }
                
                html += `</div>`;
                DOM.searchDropdown.innerHTML = html;
                DOM.searchDropdown.classList.remove('hidden');
            } else {
                DOM.searchDropdown.innerHTML = `<div class="px-4 py-8 text-center text-slate-400 text-sm font-medium">No gear found matching "${state.searchQuery}"</div>`;
                DOM.searchDropdown.classList.remove('hidden');
            }
        });

        // Close dropdown when clicking outside
        document.addEventListener('mousedown', (e) => {
            const container = document.getElementById('search-container');
            if (container && !container.contains(e.target)) {
                DOM.searchDropdown.classList.add('hidden');
            }
        });

        // Category Filter Handling
        DOM.categorySelect.addEventListener('change', (e) => {
            state.activeCategory = e.target.value;
            // Expand newly selected category
            if (state.activeCategory !== 'all') {
                state.expanded.add(state.activeCategory);
            }
            renderInventory();
        });

        function renderModal() {
            const entries = Array.from(state.selected.entries());
            DOM.modalSubtitle.textContent = `${entries.length} Items Selected`;
            
            if (entries.length === 0) {
                DOM.modalList.innerHTML = `
                    <div class="text-center py-12 px-4 flex flex-col items-center">
                        <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-300 dark:text-slate-600 mb-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        </div>
                        <p class="text-slate-500 dark:text-slate-400 font-medium text-sm sm:text-base">Your loadout is empty.<br/>Select items to request a quote.</p>
                    </div>
                `;
                DOM.modalFooter.classList.add('hidden');
            } else {
                DOM.modalList.innerHTML = entries.map(([name, detail]) => `
                    <div class="group flex items-center justify-between p-3 sm:p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
                        <div class="min-w-0 pr-4">
                            <p class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 leading-tight">${name}</p>
                            <div class="flex items-center space-x-2 mt-1">
                                <span class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase">QTY: ${detail.qty}</span>
                                <span class="text-[10px] font-black text-brand/60 dark:text-blue-400/60 uppercase">• ${detail.category}</span>
                            </div>
                        </div>
                        <button data-action="remove-modal-item" data-name="${encodeURIComponent(name)}" class="p-2 sm:p-2.5 text-red-500/70 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-500/10 rounded-full transition-all opacity-100 sm:opacity-0 sm:group-hover:opacity-100">
                            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
                `).join('');
                DOM.modalFooter.classList.remove('hidden');
            }
        }

        function generateListString(isHtml = false) {
            const separator = isHtml ? '%0D%0A' : '%0A';
            return Array.from(state.selected.entries())
                .map(([name, detail]) => `• ${name} (x${detail.qty})`)
                .join(separator);
        }

        function sendWhatsApp() {
            if (state.selected.size === 0) return;
            const list = generateListString(false);
            const message = `*Polar Bear Films - Gear Inquiry*%0A%0AHello Himanshu, I'm interested in renting the following items:%0A%0A${list}%0A%0APlease share availability and a quote.`;
            window.open(`https://wa.me/919650563719?text=${message}`, '_blank');
        }

        function sendEmail() {
            if (state.selected.size === 0) return;
            const list = generateListString(true);
            const subject = "Rental Inquiry: Polar Bear Films";
            const body = `Dear Polar Bear Films Team,%0D%0A%0D%0AI am reaching out to inquire about the following equipment:%0D%0A%0D%0A${list}%0D%0A%0D%0APlease let me know the rental rates and availability.%0D%0A%0D%0ABest regards.`;
            window.location.href = `mailto:himanshusharma280@gmail.com?subject=${subject}&body=${body}`;
        }

        // Start App
        fetchInventory();
    </script>
</body>
</html>
