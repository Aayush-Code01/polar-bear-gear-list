                    WhatsApp

                <button onclick="sendEmail()" class="flex-1 sm:min-w-[160px] bg-brand hover:opacity-90 text-white px-4 py-3 sm:py-4 rounded-xl text-xs sm:text-sm font-extrabold flex items-center justify-center transition-all active:scale-[0.98] shadow-lg shadow-brand/20 whitespace-nowrap">
                    <svg class="w-4 h-4 mr-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>

    <script>
        const inventoryData = [

                items: [

                    { name: "NP-F Battery Adapters (TX/RX)", qty: 2 },

                ]
            },
            {
                id: "ronin-4d",
                category: "Ronin 4D Flex 8K",
                items: [
                    { name: "Hasselblad Zenmuse 8K Camera", qty: 1 },
                    { name: "4D Flex Extension Setup", qty: 1 },
                    { name: "Tilta Full Camera Cage", qty: 1 },
                    { name: "DJI High Bright Monitor 7 inch", qty: 3 },
                    { name: "DJI Focus Pro Full Kit (LIDAR)", qty: 1 },
                    { name: "1TB PRO SSD Cards", qty: 3 },

                ]
            },
            {
                id: "lenses",
                category: "Lens Compatibility",
                items: [
                    { name: "Cooke SP3 Prime Set", qty: 1 },
                    { name: "Carl Zeiss Batis/Milvus Set", qty: 1 },
                    { name: "Sony G Master Prime Set", qty: 1 },
                    { name: "Laowa Nanomorph (27, 35, 50)", qty: 1 },
                    { name: "Zeiss Nano Prime (24, 35, 50)", qty: 1 },
                    { name: "DZO Vespid Prime & Retro", qty: 1 },
                    { name: "Zeiss Super Speed Set", qty: 1 },
                    { name: "NiSi Athena Prime Set", qty: 1 },
                    { name: "Kowa Anamorphic Set", qty: 1 },
                    { name: "Blazar Remus/Mantis Anamorphic", qty: 1 }
                ]
            },
            {
                id: "communication",
                category: "Communication",
                items: [
                    { name: "Hollyland Talkback System", qty: 4 }
                ]
            }
        ];

        let selectedItems = new Set();
        let activeCategory = 'all';

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            const categories = [{ id: 'all', category: 'All Gear' }, ...inventoryData];
            
            tabsContainer.innerHTML = categories.map(cat => `
                <button onclick="setActiveCategory('${cat.id}')" 
                        id="tab-${cat.id}"
                        class="px-4 py-2 rounded-full border border-slate-200 text-xs font-bold whitespace-nowrap transition-all
                        ${activeCategory === cat.id ? 'tab-active' : 'bg-white text-slate-500 hover:border-brand/40'}">
                    ${cat.category}
                </button>
            `).join('');
        }

        function setActiveCategory(id) {
            activeCategory = id;
            renderTabs();
            renderInventory();
            
            // Scroll to the top of the inventory container for better UX
            if (id !== 'all') {
                const target = document.getElementById(`section-${id}`);
                if (target) {
                    const headerOffset = 140;
                    const elementPosition = target.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                    window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                }
            }
        }

        function renderInventory() {
            const container = document.getElementById('inventory-container');
            const filteredData = activeCategory === 'all' 
                ? inventoryData 
                : inventoryData.filter(cat => cat.id === activeCategory);

            container.innerHTML = filteredData.map((cat, catIdx) => `
                <section id="section-${cat.id}">
                    <div class="flex items-end justify-between mb-4 sm:mb-8 border-b-2 border-slate-50 pb-3 sm:pb-4">
                        <h3 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight leading-tight">
                            ${cat.category}
                        </h3>
                        <span class="text-[9px] sm:text-[10px] font-black text-brand tracking-[0.1em] uppercase bg-brand/5 px-2 py-1 rounded-md mb-0.5 whitespace-nowrap shrink-0 ml-4">${cat.items.length} Items</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
                        ${cat.items.map((item, itemIdx) => {
                            const itemId = `item-${catIdx}-${itemIdx}`;
                            const isChecked = selectedItems.has(item.name);
                            return `
                                <div class="relative group">
                                    <input type="checkbox" id="${itemId}" class="hidden" 
                                           ${isChecked ? 'checked' : ''}
                                           onchange="toggleItem('${itemId}', '${item.name}')">
                                    <label for="${itemId}" class="item-card flex items-center justify-between p-3 sm:p-5 bg-white border border-slate-200 rounded-xl sm:rounded-2xl cursor-pointer hover:border-brand/30 transition-all select-none">
                                        <div class="flex items-center space-x-3 sm:space-x-4">
                                            <div class="check-icon ${isChecked ? 'opacity-100 scale-100' : 'opacity-0 scale-50'} transition-all text-brand shrink-0">
                                                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                                            </div>
                                            <span class="text-sm sm:text-[15px] font-bold text-slate-800 leading-snug">${item.name}</span>
                                        </div>
                                        <div class="text-[9px] sm:text-[10px] font-black bg-slate-100 text-slate-500 px-2 py-1 rounded-md uppercase tracking-tighter shrink-0 ml-2">
                                            x${item.qty}
                                        </div>
                                    </label>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </section>
            `).join('');
        }

        function toggleItem(id, name) {
            if (selectedItems.has(name)) {
                selectedItems.delete(name);
            } else {
                selectedItems.add(name);
            }
            updateInquiryBar();
        }

        function updateInquiryBar() {
            const bar = document.getElementById('inquiry-bar');
            const countEl = document.getElementById('selected-count');
            
            countEl.textContent = selectedItems.size;
            
            if (selectedItems.size > 0) {
                bar.classList.add('visible');
            } else {
                bar.classList.remove('visible');
            }
        }

        function clearSelection() {
            selectedItems.clear();
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateInquiryBar();
            renderInventory(); // Refresh visual state if filtered
        }

        function generateListString() {
            return Array.from(selectedItems).join('%0A• ');
        }

        function sendWhatsApp() {
            const list = generateListString();
            const message = `*Polar Bear Films - Gear Inquiry*%0A%0AHello Himanshu, I'm interested in renting the following items:%0A%0A• ${list}%0A%0APlease share availability and a quote for these.`;
            window.open(`https://wa.me/919650563719?text=${message}`, '_blank');
        }

        function sendEmail() {
            const list = Array.from(selectedItems).join('%0D%0A• ');
            const subject = "Rental Inquiry: Polar Bear Films Inventory";
            const body = `Dear Polar Bear Films Team,%0D%0A%0D%0AI am reaching out to inquire about the following equipment availability:%0D%0A%0D%0A• ${list}%0D%0A%0D%0APlease let me know the rental rates for these items for my upcoming project.%0D%0A%0D%0ABest regards.`;
            window.location.href = `mailto:himanshusharma280@gmail.com?subject=${subject}&body=${body}`;
        }

        window.onload = () => {
            renderTabs();
            renderInventory();
        };
    </script>
</body>
