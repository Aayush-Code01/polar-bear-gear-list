    <script>
        const DOM = {
            loadingState: document.getElementById('loading-state'),
            errorState: document.getElementById('error-state'),

            searchInput: document.getElementById('search-input'),
            searchDropdown: document.getElementById('search-dropdown'),
            searchWrapper: document.getElementById('search-wrapper'),
            categorySelect: document.getElementById('category-select'),
            checkoutBar: document.getElementById('checkout-bar'),
            selectedCount: document.getElementById('selected-count'),
            mobileSelectedCount: document.getElementById('mobile-selected-count'),
            previewModal: document.getElementById('preview-modal'),
            modalOverlay: document.getElementById('modal-overlay'),
            modalCount: document.getElementById('modal-count'),
            modalItemList: document.getElementById('modal-item-list'),
            modalFooter: document.getElementById('modal-footer'),
            themeSun: document.getElementById('theme-icon-sun'),
            themeMoon: document.getElementById('theme-icon-moon'),
        };

        const state = {
            inventoryData: [],
            selected: new Map(), // Map<itemName, {qty, categoryTitle}>
            expandedCategories: new Set(), // Empty by default so they start collapsed
            activeCategory: 'all',
            searchQuery: ''
        };

        const SHEET_ID = '1_AvwvVEFlmxadelY73dG6u1QP1LCKLzEnz3EzWcvlMQ';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=Live`;

        // --- Theme Management ---
        function initTheme() {
            const isDarkStored = localStorage.getItem('theme') === 'dark';
            const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDarkStored || (!localStorage.getItem('theme') && isSystemDark)) {
                document.documentElement.classList.add('dark');
                DOM.themeSun.classList.remove('hidden');
                DOM.themeMoon.classList.add('hidden');
            } else {
                DOM.themeSun.classList.add('hidden');
                DOM.themeMoon.classList.remove('hidden');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            DOM.themeSun.classList.toggle('hidden', !isDark);
            DOM.themeMoon.classList.toggle('hidden', isDark);
        }

        // --- CSV Parsing ---
        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cur = '';
            let inQuote = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let next = text[i + 1];
                if (char === '"' && inQuote && next === '"') { cur += '"'; i++; }
                else if (char === '"') { inQuote = !inQuote; }
                else if (char === ',' && !inQuote) { row.push(cur.trim()); cur = ''; }
                else if ((char === '\r' || char === '\n') && !inQuote) {
                    row.push(cur.trim());
                    if (row.length > 0) rows.push(row);
                    row = []; cur = '';
                    if (char === '\r' && next === '\n') i++;
                } else { cur += char; }
            }
            if (cur !== '' || row.length > 0) { row.push(cur.trim()); rows.push(row); }
            return rows;
        }

        // --- Data Fetching ---
        async function fetchInventory() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Failed to fetch data');
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                if (rows.length < 2) throw new Error('Empty dataset');

                const headers = rows[0].map(h => h.toLowerCase().trim());
                const catIdx = headers.indexOf('category');
                const descIdx = headers.indexOf('description');
                const qtyIdx = headers.indexOf('qty');

                const groups = {};
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length <= Math.max(catIdx, descIdx)) continue;
                    const category = row[catIdx];
                    const name = row[descIdx];
                    const qty = (qtyIdx !== -1 && row[qtyIdx]) ? row[qtyIdx] : '1';

                    if (category && name && isNaN(category)) {
                        if (!groups[category]) {
                            groups[category] = {
                                id: category.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                                title: category,
                                items: []
                            };
                        }
                        groups[category].items.push({ name, qty });
                    }
                }
                
                state.inventoryData = Object.values(groups);
                DOM.loadingState.classList.add('hidden');
                
                populateCategoryDropdown();
                renderInventory();

            } catch (err) {
                console.error("Error fetching inventory:", err);
                DOM.loadingState.classList.add('hidden');
                DOM.errorState.classList.remove('hidden');
            }
        }

        function populateCategoryDropdown() {
            const options = state.inventoryData.map(cat => `<option value="${cat.id}">${cat.title}</option>`).join('');
            DOM.categorySelect.innerHTML = '<option value="all">All Categories</option>' + options;
        }

        // --- Rendering Core ---
        function renderInventory() {
            const normalizedQuery = state.searchQuery.toLowerCase().replace(/\s+/g, '');
            
            const filteredData = state.inventoryData
                .filter(cat => state.activeCategory === 'all' || cat.id === state.activeCategory)
                .map(cat => {
                    const filteredItems = cat.items.filter(item => {
                        if (!state.searchQuery) return true;
                        return item.name.toLowerCase().replace(/\s+/g, '').includes(normalizedQuery);
                    });
                    return { ...cat, items: filteredItems };
                })
                .filter(cat => cat.items.length > 0);

            if (filteredData.length === 0) {
                DOM.categoriesWrapper.innerHTML = '';
                DOM.emptyState.classList.remove('hidden');
                return;
            }

            DOM.emptyState.classList.add('hidden');
            DOM.categoriesWrapper.innerHTML = filteredData.map(cat => {
                const isExpanded = state.expandedCategories.has(cat.id);
                const allSelected = cat.items.every(item => state.selected.has(item.name));
                
                return `
                <section class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800/60 overflow-hidden mb-6 transition-all duration-300 hover:shadow-md" id="cat-${cat.id}">
                    <!-- Header -->
                    <div class="flex items-center justify-between p-4 sm:p-5 cursor-pointer select-none group bg-slate-50/50 dark:bg-slate-800/20 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors" onclick="toggleExpansion('${cat.id}')">
                        <div class="flex items-center space-x-3 sm:space-x-4 flex-1 min-w-0 pr-4">
                            <div class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 group-hover:bg-[#110086]/10 dark:group-hover:bg-blue-500/20 group-hover:text-[#110086] dark:group-hover:text-blue-400 transition-all duration-300 ${isExpanded ? 'rotate-180 bg-[#110086]/10 text-[#110086] dark:bg-blue-500/20 dark:text-blue-400' : ''}">
                                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                            </div>
                            <div class="min-w-0 flex-1">
                                <h3 class="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-white truncate tracking-tight">${cat.title}</h3>
                                <div class="flex items-center space-x-2 mt-0.5">
                                    <span class="text-[10px] sm:text-xs font-black text-slate-400 uppercase tracking-wider">${cat.items.length} Items</span>
                                    ${state.searchQuery ? '<span class="text-[10px] bg-brand/10 text-brand px-1.5 rounded">Filtered</span>' : ''}
                                </div>
                            </div>
                        </div>
                        
                        <button onclick="handleSelectAll(event, '${cat.id}')" class="relative z-10 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-wider transition-all duration-200 active:scale-95 whitespace-nowrap overflow-hidden ${allSelected ? 'bg-[#110086] text-white border-transparent shadow-md shadow-[#110086]/20' : 'bg-white dark:bg-slate-950 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:border-[#110086]/50 dark:hover:border-blue-500/50'}">
                            ${allSelected ? 'Clear All' : 'Select All'}
                        </button>
                    </div>

                    <!-- Grid Content -->
                    <div class="category-content ${isExpanded ? 'expanded' : ''}">
                        <div class="p-4 sm:p-5 pt-0 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 bg-slate-50/20 dark:bg-transparent">
                            ${cat.items.map((item, idx) => {
                                const isSelected = state.selected.has(item.name);
                                // Escape strings for inline handlers
                                const escapedName = item.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                                const escapedCat = cat.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                                
                                return `
                                <div onclick="toggleItem('${escapedName}', '${item.qty}', '${escapedCat}')" class="relative group flex items-center justify-between p-3 sm:p-4 h-full rounded-2xl border-2 transition-all duration-200 cursor-pointer select-none ${isSelected ? 'bg-blue-50/50 dark:bg-blue-900/20 border-[#110086] dark:border-blue-500 shadow-sm' : 'bg-white dark:bg-slate-900 border-slate-100 dark:border-slate-800 hover:border-[#110086]/30 dark:hover:border-blue-500/40 hover:shadow-md'}">
                                    <div class="flex items-center space-x-3 flex-1 min-w-0">
                                        <div class="flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 flex items-center justify-center transition-all duration-300 ${isSelected ? 'border-[#110086] dark:border-blue-500 bg-[#110086] dark:bg-blue-500 text-white' : 'border-slate-300 dark:border-slate-600 group-hover:border-[#110086]/50 dark:group-hover:border-blue-500/50'}">
                                            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 transition-transform duration-300 ${isSelected ? 'scale-100' : 'scale-0'}" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                                        </div>
                                        <span class="text-[13px] sm:text-[15px] font-bold leading-tight truncate transition-colors ${isSelected ? 'text-[#110086] dark:text-blue-100' : 'text-slate-700 dark:text-slate-200'}">
                                            ${item.name}
                                        </span>
                                    </div>
                                    ${item.qty && item.qty !== '1' ? `<div class="ml-2 flex-shrink-0 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-md text-[10px] sm:text-xs font-black text-slate-500 dark:text-slate-400">x${item.qty}</div>` : ''}
                                </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </section>
                `;
            }).join('');
        }

        // --- Interaction Handlers ---
        function toggleExpansion(catId) {
            if (state.expandedCategories.has(catId)) {
                state.expandedCategories.delete(catId);
            } else {
                state.expandedCategories.add(catId);
            }
            renderInventory();
        }

        function handleSelectAll(e, catId) {
            e.stopPropagation(); // Stop expansion toggle
            
            // Find category
            const category = state.inventoryData.find(c => c.id === catId);
            if (!category) return;
            
            // Filter by search query if applicable to respect current view
            const normalizedQuery = state.searchQuery.toLowerCase().replace(/\s+/g, '');
            const visibleItems = category.items.filter(item => {
                if (!state.searchQuery) return true;
                return item.name.toLowerCase().replace(/\s+/g, '').includes(normalizedQuery);
            });

            const allSelected = visibleItems.every(item => state.selected.has(item.name));
            
            visibleItems.forEach(item => {
                if (allSelected) {
                    state.selected.delete(item.name);
                } else {
                    state.selected.set(item.name, { qty: item.qty, categoryTitle: category.title });
                }
            });

            updateCheckoutBar();
            renderInventory();
        }

        function toggleItem(name, qty, categoryTitle) {
            if (state.selected.has(name)) {
                state.selected.delete(name);
            } else {
                state.selected.set(name, { qty, categoryTitle });
            }
            updateCheckoutBar();
            renderInventory();
        }

        function updateCheckoutBar() {
            const count = state.selected.size;
            DOM.selectedCount.textContent = count;
            if (DOM.mobileSelectedCount) DOM.mobileSelectedCount.textContent = count;
            
            if (count > 0) {
                DOM.checkoutBar.classList.remove('hidden-bar');
                DOM.checkoutBar.classList.add('visible-bar');
            } else {
                DOM.checkoutBar.classList.add('hidden-bar');
                DOM.checkoutBar.classList.remove('visible-bar');
                
                // Auto collapse mobile detail view when completely cleared
                const detailView = document.getElementById('detailed-info-section');
                const expandIcon = document.getElementById('mobile-expand-icon');
                if (detailView) detailView.classList.add('hidden');
                if (expandIcon) expandIcon.classList.remove('rotate-180');
            }
        }

        // --- Search Handling ---
        DOM.searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            state.searchQuery = val;
            
            if (!val.trim()) {
                DOM.searchDropdown.classList.add('hidden');
                renderInventory();
                return;
            }

            const normalizedQuery = val.toLowerCase().replace(/\s+/g, '');
            const matches = [];
            
            state.inventoryData.forEach(cat => {
                cat.items.forEach(item => {
                    if (item.name.toLowerCase().replace(/\s+/g, '').includes(normalizedQuery)) {
                        matches.push({ ...item, categoryTitle: cat.title, catId: cat.id });
                    }
                });
            });

            if (matches.length > 0) {
                DOM.searchDropdown.classList.remove('hidden');
                let html = `
                    <div class="px-4 py-2 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center sticky top-0 z-10 backdrop-blur-md">
                        <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Results for "${val}"</span>
                        <span class="text-[10px] font-black bg-[#110086]/10 dark:bg-blue-500/20 text-[#110086] dark:text-blue-400 px-2 py-0.5 rounded-full">${matches.length}</span>
                    </div>
                    <div class="py-2">
                `;
                
                html += matches.slice(0, 15).map((match, idx) => {
                    const escapedName = match.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const escapedCat = match.categoryTitle.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    return `
                    <button onclick="handleSearchSelect('${escapedName}', '${match.qty}', '${escapedCat}', '${match.catId}')" class="w-full text-left px-4 py-3 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between transition-colors border-b border-slate-50 dark:border-slate-800/30 last:border-0">
                        <div class="min-w-0 pr-3">
                            <p class="text-sm font-bold text-slate-800 dark:text-slate-200 truncate">${match.name}</p>
                            <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5 tracking-wide">${match.categoryTitle}</p>
                        </div>
                        <div class="shrink-0 text-[10px] font-black text-[#110086] dark:text-blue-400 bg-[#110086]/5 dark:bg-blue-500/10 px-2 py-1 rounded">
                            SELECT
                        </div>
                    </button>
                    `;
                }).join('');

                if(matches.length > 15) {
                    html += `<div class="px-4 py-3 text-center text-xs font-bold text-slate-400">+ ${matches.length - 15} more. Keep typing.</div>`;
                }
                
                html += '</div>';
                DOM.searchDropdown.innerHTML = html;
            } else {
                DOM.searchDropdown.innerHTML = '<div class="px-4 py-8 text-center text-slate-400 text-sm font-medium">No gear found matching this search.</div>';
                DOM.searchDropdown.classList.remove('hidden');
            }
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!DOM.searchWrapper.contains(e.target)) {
                DOM.searchDropdown.classList.add('hidden');
            }
        });

        DOM.searchInput.addEventListener('focus', () => {
            if(state.searchQuery.trim() && DOM.searchDropdown.innerHTML !== '') {
                DOM.searchDropdown.classList.remove('hidden');
            }
        });

        function handleSearchSelect(name, qty, categoryTitle, catId) {
            state.expandedCategories.add(catId);
            
            if (!state.selected.has(name)) {
                state.selected.set(name, { qty, categoryTitle });
                updateCheckoutBar();
            }
            
            DOM.searchDropdown.classList.add('hidden');
            DOM.searchInput.value = '';
            state.searchQuery = '';
            renderInventory();

            setTimeout(() => {
                const el = document.getElementById(`cat-${catId}`);
                if (el) {
                    const y = el.getBoundingClientRect().top + window.pageYOffset - 150;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                }
            }, 100);
        }

        // --- Category Filter ---
        DOM.categorySelect.addEventListener('change', (e) => {
            state.activeCategory = e.target.value;
            if (state.activeCategory !== 'all') {
                state.expandedCategories.add(state.activeCategory);
            }
            renderInventory();
            if (state.activeCategory !== 'all' && !state.searchQuery) {
                const target = document.getElementById(`cat-${state.activeCategory}`);
                if (target) {
                    setTimeout(() => {
                        window.scrollTo({ top: target.getBoundingClientRect().top + window.pageYOffset - 180, behavior: 'smooth' });
                    }, 50);
                }
            }
        });

        // --- Modal Handling ---
        function openPreviewModal() {
            DOM.modalCount.textContent = state.selected.size;
            
            if (state.selected.size === 0) {
                DOM.modalItemList.innerHTML = `
                    <div class="text-center py-12 px-4 flex flex-col items-center">
                        <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-slate-300 dark:text-slate-600 mb-4">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        </div>
                        <p class="text-slate-500 dark:text-slate-400 font-medium text-sm sm:text-base">Your loadout is empty.<br/>Select items to request a quote.</p>
                    </div>
                `;
                DOM.modalFooter.classList.add('hidden');
            } else {
                DOM.modalItemList.innerHTML = Array.from(state.selected.entries()).map(([name, detail]) => {
                    const escapedName = name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const escapedCat = detail.categoryTitle.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    return `
                    <div class="group flex items-center justify-between p-3 sm:p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
                        <div class="min-w-0 pr-4">
                            <p class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 leading-tight">${name}</p>
                            <div class="flex items-center space-x-2 mt-1">
                                <span class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase">QTY: ${detail.qty}</span>
                                <span class="text-[10px] font-black text-[#110086]/60 dark:text-blue-400/60 uppercase">• ${detail.categoryTitle}</span>
                            </div>
                        </div>
                        <button onclick="removeItemFromModal('${escapedName}', '${escapedCat}')" class="p-2 sm:p-2.5 text-red-500/70 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-500/10 rounded-full transition-all opacity-100 sm:opacity-0 sm:group-hover:opacity-100">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
                `}).join('');
                DOM.modalFooter.classList.remove('hidden');
            }
            
            DOM.previewModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closePreviewModal() {
            DOM.previewModal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function removeItemFromModal(name, categoryTitle) {
            toggleItem(name, null, categoryTitle);
            openPreviewModal(); // refresh modal content
            if(state.selected.size === 0) {
                closePreviewModal();
            }
        }

        DOM.viewListBtn = document.getElementById('view-list-btn');
        DOM.clearListBtn = document.getElementById('clear-list-btn');
        DOM.closeModalBtn = document.getElementById('close-modal-btn');
        DOM.continueAddingBtn = document.getElementById('continue-adding-btn');

        DOM.viewListBtn.addEventListener('click', openPreviewModal);
        DOM.closeModalBtn.addEventListener('click', closePreviewModal);
        DOM.continueAddingBtn.addEventListener('click', closePreviewModal);
        DOM.modalOverlay.addEventListener('click', closePreviewModal);
        
        DOM.clearListBtn.addEventListener('click', () => {
            state.selected.clear();
            updateCheckoutBar();
            renderInventory();
            closePreviewModal();
        });

        // --- Communication Logic ---
        function generateListString(isHtml = false) {
            const separator = isHtml ? '%0D%0A' : '%0A';
            const result = [];

            // Sort categories alphabetically to maintain consistent order
            const sortedCategories = [...state.inventoryData].sort((a, b) => a.title.localeCompare(b.title));

            for (const category of sortedCategories) {
                // Find selected items belonging to this specific category
                const selectedInCategory = category.items.filter(item => state.selected.has(item.name));
                
                if (selectedInCategory.length === 0) continue;

                result.push(`*${category.title}*`);
                
                // If the number of selected items matches the total items in the category
                if (selectedInCategory.length === category.items.length) {
                    result.push(`  • All`);
                } else {
                    // Otherwise, list them out individually
                    selectedInCategory.forEach(item => {
                        const detail = state.selected.get(item.name);
                        result.push(`  • ${item.name} (x${detail.qty})`);
                    });
                }
                result.push(''); // blank line spacing
            }
            
            return result.join(separator).trim();
        }

        document.getElementById('whatsapp-btn').addEventListener('click', () => {
            if (state.selected.size === 0) return;
            const list = generateListString(false);
            const message = `*Polar Bear Films - Gear Inquiry*%0A%0AHello Himanshu, I'm interested in renting the following items:%0A%0A${list}%0A%0APlease share availability and a quote.`;
            window.open(`https://wa.me/919650563719?text=${message}`, '_blank');
        });

        document.getElementById('email-btn').addEventListener('click', () => {
            if (state.selected.size === 0) return;
            const list = generateListString(true);
            const subject = "Rental Inquiry: Polar Bear Films";
            const body = `Dear Polar Bear Films Team,%0D%0A%0D%0AI am reaching out to inquire about the following equipment:%0D%0A%0D%0A${list}%0D%0A%0D%0APlease let me know the rental rates and availability.%0D%0A%0D%0ABest regards.`;
            window.location.href = `mailto:himanshusharma280@gmail.com?subject=${subject}&body=${body}`;
        });

        // --- Initialization ---
        window.onload = () => {
            initTheme();
            fetchInventory();
        };
    </script>
</body>
