    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #fcfcfd; 
            color: #0f172a; 
        }
        
        .sticky-footer { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(17, 0, 134, 0.08);
            z-index: 50;
            transform: translateY(100%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -15px 40px -10px rgba(17, 0, 134, 0.1);
        }
        .sticky-footer.visible { transform: translateY(0); }
        
        .item-card {
            transition: all 0.2s ease;
        }
        
        input[type="checkbox"]:checked + label {
            background-color: #fff;
            border-color: #110086;
            box-shadow: 0 0 0 1px #110086, 0 10px 15px -3px rgba(17, 0, 134, 0.05);
        }

        input[type="checkbox"]:checked + label .check-icon {
            opacity: 1;
            transform: scale(1);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #110086; border-radius: 10px; }
    </style>
</head>
<body class="pb-32">

    <!-- Header -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
            <div class="flex items-center">
                <div class="h-12 w-auto flex items-center">
                    <img src="https://lh3.googleusercontent.com/d/18GG_sRWwFyK_or7uQDR2FE4oItbIpEZ1" 
                         alt="Polar Bear Films" 
                         class="h-full object-contain"
                         onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'bg-brand text-white px-3 py-1 rounded-lg font-bold text-lg\'>POLAR BEAR</div>'">

            </div>
            
            <div class="flex items-center">
                <a href="tel:+919650563719" class="flex items-center space-x-2 px-4 py-2 bg-brand/5 rounded-xl hover:bg-brand/10 transition-colors group">
                    <svg class="w-4 h-4 text-brand group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-12">
        <div class="max-w-4xl mb-12">
            <h2 class="text-4xl sm:text-6xl font-extrabold text-slate-900 tracking-tight mb-6 leading-[1.1]">
                Production <span class="text-brand italic">Ready.</span>

            <p class="text-lg sm:text-xl text-slate-500 leading-relaxed font-medium">

    <!-- Inquiry Bar -->
    <div id="inquiry-bar" class="sticky-footer px-4 py-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex items-center space-x-5">
                <div class="relative">
                    <div class="bg-brand text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-xl shadow-brand/20">
                        <span id="selected-count" class="text-2xl font-extrabold">0</span>
                    </div>
                </div>
                <div>
                    <h4 class="font-bold text-lg text-slate-900 tracking-tight">Selection List</h4>
                    <button onclick="clearSelection()" class="text-[10px] font-black text-red-500 hover:text-red-600 tracking-[0.1em] uppercase transition-colors block">Clear List</button>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row w-full md:w-auto gap-3">
                <button onclick="sendWhatsApp()" class="flex-1 sm:min-w-[200px] bg-green-600 hover:bg-green-700 text-white px-6 py-4 rounded-xl text-sm font-extrabold flex items-center justify-center transition-all active:scale-[0.98] shadow-lg shadow-green-600/10">
                    <svg class="w-5 h-5 mr-2.5 fill-current" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    WhatsApp
                </button>
                <button onclick="sendEmail()" class="flex-1 sm:min-w-[200px] bg-brand hover:opacity-90 text-white px-6 py-4 rounded-xl text-sm font-extrabold flex items-center justify-center transition-all active:scale-[0.98] shadow-lg shadow-brand/20">
                    <svg class="w-5 h-5 mr-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    Email Quote
                </button>
            </div>
        </div>
    </div>

    <script>
        const inventoryData = [
            {
                category: "Ronin 2 Gimbal System",
                items: [
                    { name: "Ronin 2 Gimbal", qty: 1 },
                    { name: "DJI Joystick Control", qty: 1 },
                    { name: "DJI Force Pro (Mimic)", qty: 1 },
                    { name: "DJI TB 50 Batteries", qty: 8 },
                    { name: "Alexa 35 Power Cable", qty: 1 },
                    { name: "Sony Venice 1 & 2 Cable", qty: 1 },
                    { name: "ARRI Alexa Mini Power", qty: 1 },
                    { name: "RED Power & Control", qty: 2 },
                    { name: "Triple P-TAP Breakout", qty: 1 },
                    { name: "Kaushal Classic Handle", qty: 1 },
                    { name: "Vibration Isolator", qty: 1 }
                ]
            },
            {
                category: "Precision Control Gears",
                items: [
                    { name: "Nodo Inertia Wheels (2 Axis)", qty: 1 },
                    { name: "DJI Master Wheels (3 Axis)", qty: 1 },
                    { name: "DJI Video Transmission", qty: 1 },
                    { name: "DJI Force Pro Unit", qty: 1 }
                ]
            },
            {
                category: "Ready Rig & Support",
                items: [
                    { name: "Tilta Armour Man 2", qty: 1 },
                    { name: "Ready Rig GS + Pro Arm", qty: 1 },
                    { name: "Vega V2 Upgrade Kit", qty: 2 },
                    { name: "Cobra Quick Connect V2", qty: 2 },
                    { name: "Locking Quick Connect", qty: 1 }
                ]
            },
            {
                category: "Ronin 4D Flex 8K Ecosystem",
                items: [
                    { name: "Zenmuse 8K Camera Unit", qty: 1 },
                    { name: "4D Flex Extension Setup", qty: 1 },
                    { name: "Tilta Full Cage System", qty: 1 },
                    { name: "DJI Focus Pro / LIDAR", qty: 1 },
                    { name: "1TB PRO SSD Media", qty: 3 },
                    { name: "DZO Octopus (PL to DX)", qty: 1 },
                    { name: "X9 E Mount Unit", qty: 1 }
                ]
            },
            {
                category: "Lenses & Optics",
                items: [
                    { name: "Cooke SP3 Series", qty: 1 },
                    { name: "Sony G Master Selection", qty: 1 },
                    { name: "Laowa Nanomorph Set", qty: 1 },
                    { name: "Zeiss Nano Primes", qty: 1 },
                    { name: "NiSi Athena Primes", qty: 1 },
                    { name: "Kowa Anamorphic", qty: 1 }
                ]
            },
            {
                category: "Vehicle Stabilization",
                items: [
                    { name: "Easy Raptor Magnet Rig", qty: 1 },
                    { name: "Blackarm (11-70 lbs)", qty: 1 },
                    { name: "Tranquilizer Vibration Mount", qty: 1 },
                    { name: "Multi Angle Mitchell Mount", qty: 1 }
                ]
            }
        ];

        let selectedItems = new Set();

        function renderInventory() {
            const container = document.getElementById('inventory-container');
            container.innerHTML = inventoryData.map((cat, catIdx) => `
                <section>
                    <div class="flex items-end justify-between mb-8 border-b-2 border-slate-50 pb-4">
                        <h3 class="text-2xl font-extrabold text-slate-900 tracking-tight">
                            ${cat.category}
                        </h3>
                        <span class="text-[10px] font-black text-brand tracking-[0.15em] uppercase bg-brand/5 px-3 py-1.5 rounded-lg mb-1">${cat.items.length} Units</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${cat.items.map((item, itemIdx) => {
                            const itemId = `item-${catIdx}-${itemIdx}`;
                            return `
                                <div class="relative group">
                                    <input type="checkbox" id="${itemId}" class="hidden" 
                                           onchange="toggleItem('${itemId}', '${item.name}')">
                                    <label for="${itemId}" class="item-card flex items-center justify-between p-5 bg-white border border-slate-200 rounded-2xl cursor-pointer hover:border-brand/30 transition-all select-none">
                                        <div class="flex items-center space-x-4">
                                            <div class="check-icon opacity-0 transform scale-50 transition-all text-brand">
                                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                                            </div>
                                            <span class="text-[15px] font-bold text-slate-800 leading-tight">${item.name}</span>
                                        </div>
                                        <div class="text-[10px] font-black bg-slate-100 text-slate-500 px-2 py-1 rounded-lg uppercase tracking-tighter shrink-0">
                                            x${item.qty}
                                        </div>
                                    </label>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </section>
            `).join('');
        }

        function toggleItem(id, name) {
            if (selectedItems.has(name)) {
                selectedItems.delete(name);
            } else {
                selectedItems.add(name);
            }
            updateInquiryBar();
        }

        function updateInquiryBar() {
            const bar = document.getElementById('inquiry-bar');
            const countEl = document.getElementById('selected-count');
            
            countEl.textContent = selectedItems.size;
            
            if (selectedItems.size > 0) {
                bar.classList.add('visible');
            } else {
                bar.classList.remove('visible');
            }
        }

        function clearSelection() {
            selectedItems.clear();
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateInquiryBar();
        }

        function generateListString() {
            return Array.from(selectedItems).join('%0A• ');
        }

        function sendWhatsApp() {
            const list = generateListString();
            const message = `*Polar Bear Films - Gear Inquiry*%0A%0AHello Himanshu, I'm interested in renting the following items:%0A%0A• ${list}%0A%0APlease share availability and a quote for these.`;
            window.open(`https://wa.me/919650563719?text=${message}`, '_blank');
        }

        function sendEmail() {
            const list = Array.from(selectedItems).join('%0D%0A• ');
            const subject = "Rental Inquiry: Polar Bear Films Inventory";
            const body = `Dear Polar Bear Films Team,%0D%0A%0D%0AI am reaching out to inquire about the following equipment availability:%0D%0A%0D%0A• ${list}%0D%0A%0D%0APlease let me know the rental rates for these items for my upcoming project.%0D%0A%0D%0ABest regards.`;
            window.location.href = `mailto:himanshusharma280@gmail.com?subject=${subject}&body=${body}`;
        }

        window.onload = renderInventory;
    </script>
</body>
</html>
