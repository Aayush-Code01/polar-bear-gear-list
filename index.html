                    <svg class="w-4 h-4 mr-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>

    <script>
        const SHEET_ID = '1_AvwvVEFlmxadelY73dG6u1QP1LCKLzEnz3EzWcvlMQ';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=Live`;

        let inventoryData = [];
        let selectedItems = new Set();
        let activeCategory = 'all';

        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cur = '';
            let inQuote = false;
            
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let next = text[i + 1];
                
                if (char === '"' && inQuote && next === '"') {
                    cur += '"';
                    i++;
                } else if (char === '"') {
                    inQuote = !inQuote;
                } else if (char === ',' && !inQuote) {
                    row.push(cur.trim());
                    cur = '';
                } else if ((char === '\r' || char === '\n') && !inQuote) {
                    row.push(cur.trim());
                    if (row.length > 0) rows.push(row);
                    row = [];
                    cur = '';
                    if (char === '\r' && next === '\n') i++;
                } else {
                    cur += char;
                }
            }
            if (cur !== '' || row.length > 0) {
                row.push(cur.trim());
                rows.push(row);
            }
            return rows;
        }

        async function fetchInventory() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                if (rows.length < 1) throw new Error('Empty spreadsheet');

                // Determine column indices from the first row
                const headers = rows[0].map(h => h.toLowerCase().trim());
                const catIdx = headers.indexOf('category');
                const descIdx = headers.indexOf('description');
                const qtyIdx = headers.indexOf('qty');

                if (catIdx === -1 || descIdx === -1) {
                    throw new Error('Required headers "Category" and "Description" not found in the first row of "Live" tab.');
                }

                const rawItems = [];
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length <= Math.max(catIdx, descIdx)) continue;
                    
                    const category = row[catIdx];
                    const description = row[descIdx];
                    const qty = (qtyIdx !== -1 && row[qtyIdx]) ? row[qtyIdx] : '1';
                    
                    // Group only if category and description are present and category isn't a serial number
                    if (category && description && isNaN(category)) {
                        rawItems.push({ category, name: description, qty });
                    }
                }

                if (rawItems.length === 0) throw new Error('No valid gear items found in the "Live" tab.');

                const groups = {};
                rawItems.forEach(item => {
                    if (!groups[item.category]) {
                        groups[item.category] = {
                            id: item.category.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                            category: item.category,
                            items: []
                        };
                    }
                    groups[item.category].items.push({ name: item.name, qty: item.qty });
                });

                inventoryData = Object.values(groups);
                renderTabs();
                renderInventory();
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('inventory-container').innerHTML = `
                    <div class="text-center py-12 px-6 bg-red-50 rounded-2xl border border-red-100 max-w-lg mx-auto">
                        <p class="text-red-700 font-bold text-lg mb-2">Sync Error</p>
                        <p class="text-sm text-red-600 mb-4">${error.message}</p>
                        <div class="text-xs text-red-500 text-left space-y-2">
                            <p><strong>Required Sheet Format:</strong></p>
                            <ul class="list-disc ml-4 space-y-1">
                                <li>Tab Name: <strong>Live</strong></li>
                                <li>Row 1 Headers: <strong>Category</strong>, <strong>Description</strong>, <strong>Qty</strong></li>
                                <li>Access: <strong>"Anyone with the link can view"</strong></li>
                            </ul>
                        </div>
                    </div>
                `;
                document.getElementById('tabs-container').innerHTML = '';
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            const categories = [{ id: 'all', category: 'All Gear' }, ...inventoryData];
            
            tabsContainer.innerHTML = categories.map(cat => `
                <button onclick="setActiveCategory('${cat.id}')" 
                        id="tab-${cat.id}"
                        class="px-4 py-2 rounded-full border border-slate-200 text-xs font-bold whitespace-nowrap transition-all
                        ${activeCategory === cat.id ? 'tab-active shadow-md' : 'bg-white text-slate-500 hover:border-brand/40 shadow-sm'}">
                    ${cat.category}
                </button>
            `).join('');
        }

        function setActiveCategory(id) {
            activeCategory = id;
            renderTabs();
            renderInventory();
            
            if (id !== 'all') {
                const target = document.getElementById(`section-${id}`);
                if (target) {
                    const headerOffset = 180;
                    const elementPosition = target.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                    window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                }
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function renderInventory() {
            const container = document.getElementById('inventory-container');
            const filteredData = activeCategory === 'all' 
                ? inventoryData 
                : inventoryData.filter(cat => cat.id === activeCategory);

            if (filteredData.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-10 px-2 text-sm italic">No items found.</p>';
                return;
            }

            container.innerHTML = filteredData.map((cat) => `
                <section id="section-${cat.id}" class="px-1">
                    <div class="flex items-end justify-between mb-4 sm:mb-8 border-b-2 border-slate-50 pb-3 sm:pb-4">
                        <h3 class="text-lg sm:text-2xl font-extrabold text-slate-900 tracking-tight leading-tight">
                            ${cat.category}
                        </h3>
                        <span class="text-[9px] sm:text-[10px] font-black text-brand tracking-[0.1em] uppercase bg-brand/5 px-2 py-1 rounded-md mb-0.5 whitespace-nowrap shrink-0 ml-4">${cat.items.length} Units</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 sm:gap-4">
                        ${cat.items.map((item, itemIdx) => {
                            const uniqueId = `item-${cat.id}-${itemIdx}`;
                            const isChecked = selectedItems.has(item.name);
                            return `
                                <div class="relative group">
                                    <input type="checkbox" id="${uniqueId}" class="hidden" 
                                           ${isChecked ? 'checked' : ''}
                                           onchange="toggleItem('${uniqueId}', '${item.name.replace(/'/g, "\\'")}')">
                                    <label for="${uniqueId}" class="item-card flex items-center justify-between p-3.5 sm:p-5 bg-white border border-slate-200 rounded-xl sm:rounded-2xl cursor-pointer hover:border-brand/30 transition-all select-none">
                                        <div class="flex items-center space-x-3 sm:space-x-4 pr-2">
                                            <div class="check-icon ${isChecked ? 'opacity-100 scale-100' : 'opacity-0 scale-50'} transition-all text-brand shrink-0">
                                                <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                                            </div>
                                            <span class="text-[13px] sm:text-[15px] font-bold text-slate-800 leading-snug">${item.name}</span>
                                        </div>
                                        <div class="text-[9px] sm:text-[10px] font-black bg-slate-100 text-slate-500 px-2 py-1 rounded-md uppercase tracking-tighter shrink-0">
                                            x${item.qty}
                                        </div>
                                    </label>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </section>
            `).join('');
        }

        function toggleItem(id, name) {
            if (selectedItems.has(name)) {
                selectedItems.delete(name);
            } else {
                selectedItems.add(name);
            }
            updateInquiryBar();
        }

        function updateInquiryBar() {
            const bar = document.getElementById('inquiry-bar');
            const countEl = document.getElementById('selected-count');
            
            countEl.textContent = selectedItems.size;
            
            if (selectedItems.size > 0) {
                bar.classList.add('visible');
            } else {
                bar.classList.remove('visible');
            }
        }

        function clearSelection() {
            selectedItems.clear();
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateInquiryBar();
            renderInventory(); 
        }

        function generateListString() {
            return Array.from(selectedItems).join('%0A• ');
        }

        function sendWhatsApp() {
            const list = generateListString();
            const message = `*Polar Bear Films - Gear Inquiry*%0A%0AHello Himanshu, I'm interested in renting the following items:%0A%0A• ${list}%0A%0APlease share availability and a quote for these.`;
            window.open(`https://wa.me/919650563719?text=${message}`, '_blank');
        }

        function sendEmail() {
            const list = Array.from(selectedItems).join('%0D%0A• ');
            const subject = "Rental Inquiry: Polar Bear Films Inventory";
            const body = `Dear Polar Bear Films Team,%0D%0A%0D%0AI am reaching out to inquire about the following equipment availability:%0D%0A%0D%0A• ${list}%0D%0A%0D%0APlease let me know the rental rates for these items for my upcoming project.%0D%0A%0D%0ABest regards.`;
            window.location.href = `mailto:himanshusharma280@gmail.com?subject=${subject}&body=${body}`;
        }

        window.onload = fetchInventory;
    </script>
